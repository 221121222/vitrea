name: Vitrea
options:
  bundleIdPrefix: cc.cardart
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1.0.0"
    TARGETED_DEVICE_FAMILY: "1"
    # AirliftFFI 为 arm64（aws-lc-rs / idevice），排除模拟器 x86_64
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  Vitrea:
    type: application
    platform: iOS
    sources:
      - path: ios-app
        excludes:
          - "Resources/**"
      # 仅嵌入素材清单 JSON（~800KB），素材图全部在线加载
      - path: ios-app/Resources/Manifests
        type: folder
      - path: ios-app/Resources/credits
        type: folder
    dependencies:
      - framework: AirliftFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: "Vitrea"
        PRODUCT_BUNDLE_IDENTIFIER: cc.cardart.workshop
        INFOPLIST_FILE: ios-app/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # idevice 静态库引入 C++ 符号（aws-lc）
        OTHER_LDFLAGS: "-lc++"
        GENERATE_INFOPLIST_FILE: NO

schemes:
  Vitrea:
    build:
      targets:
        Vitrea: all
    run:
      config: Debug
    archive:
      config: Release
